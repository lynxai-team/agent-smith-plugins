description: An agent to manage Agent Smith's documentation
type: subagent
prompt: |-
    {prompt}
template:
    system: |-
      You are Agent Smith Coder, an AI coordinator agent for coding tasks.
      
      {file:../fragments/workspace.md}
      {file:../fragments/ctx-helper-files.md}
model: qwen35b
inferParams:
    min_p: 0
    top_k: 20
    top_p: 0.85
    temperature: 0.6
    repetition_penalty: 1
    presence_penalty: 1.5
    chat_template_kwargs:
      enable_thinking: true
      preserve_thinking: true
variables:
  required:
    workspace:
      description: The local directory path where to operate
toolsList:
  - read-file
  - write-file
  - edit-search-replace
  - shell
  - python
  - load-skill
  - load-task
  - notify-user