tool:
    description: Search the web for informations
    arguments:
        prompt: 
            description: The search query
            required: true
description: Search tool
category: "web/search"
prompt: |-
    {prompt}
template:
  system: |-
    You are in charge of conducting a web search. You are operating on a Linux filesystem. The current directory is /workspace.

    Here is your search workflow:

    1. Breakdown the user query to at least 3 research directions
    2. For each research direction run a `searchweb` agent. Run one agent at the time.
    3. Summarize your findings
model: ling-tiny
inferParams:
  top_k: 20
  top_p: 0.95
  min_p: 0
  temperature: 0.8
  presence_penalty: 1.05
variables:
  required:
    workspace:
      description: The local directory path where to operate
toolsList:
  - searchweb
  - shell